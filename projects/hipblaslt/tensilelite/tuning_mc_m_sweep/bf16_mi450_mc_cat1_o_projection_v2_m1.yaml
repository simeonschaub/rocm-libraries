TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch

GlobalParameters:
  Architecture: gfx1250
  KernelTime: True
  PreciseKernelTime: False
  SleepPercent: 0
  SyncsPerBenchmark: 1
  NumBenchmarks: 1
  NumWarmups: 50
  EnqueuesPerSync: 500
  SkipSlowSolutionRatio: 0.0
  RotatingBufferSize: 512
  NumElementsToValidate: 0
  NumElementsToValidateWinner: 0
  ExitOnFails: 0
  BoundsCheck: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitSeed: 1
  CSVExportWinner: True
  CSVMergeSameProblemID: True
  CpuThreads: 32
  PrintLevel: 1
  PrintSolutionRejectionReason: True
  KeepBuildTmp: False
  UseEffLike: False

BenchmarkProblems:
  -
    - # ProblemType, TN (Cijk_Alik_Bljk_BBS_BH_Bias_HA_S_SAV_UserArgs)
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      UseBias: 1
      Batched: True
      UseScaleAlphaVec: 1
      Activation: True
      ActivationType: hipblaslt_all
      ActivationComputeDataType: s
      SupportUserArgs: True

    # [1, 8192, 1, 1024]: A is 2 KB, D is 16 KB, B is 16 MB read once. The kernel is a pure
    # B stream, so the groups below isolate one lever each instead of crossing them all.
    # Anchors are our own granularity winner (MT16x64x256) and the kernel the shipped library
    # picks for this size (MT16x128x256), plus one step wider.

    - # B streaming: M = 1 gives B no reuse down the M dimension, so the LDS round trip and
      # the global-read width are the levers with the most physical justification here.
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 4]  # MT16x64, 128 wg
          - [16, 16, 32, 1, 1, 1, 2, 1, 4]  # MT16x128, 64 wg, shipped library's pick
          - [16, 16, 32, 1, 1, 1, 4, 1, 4]  # MT16x256, 32 wg
        - DepthU: [128, 256]
        - GlobalReadVectorWidthB: [-1, 4, 8]  # GRVWB * 2 B must stay <= 24, so 16 is rejected
        - TDMInst: [0, 3]                    # 3 loads straight to LDS, 0 goes through VGPRs
        - LocalReadVectorWidth: [-1, 8]
        - HalfPLR: [0]
        - PrefetchGL2: [0, 1, 2]
        - WorkGroupMappingXCC: [1]
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - TDMIterateMode: [0]
        - TDMSplit: [False]
        - TDMPlusLdsBuf: [-1]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - ClusterLocalRead: [0]
        - ClusterDim: [[1, 1]]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - LDSSegmentInterleave: [0]
        - GlobalReadVectorWidthA: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]      # must divide MIWaveTile0, which is 1 for every MT0=16 tile
        - StoreVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [False]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
        - AssertFree0ElementMultiple: [1]    # M = 1
        - AssertFree1ElementMultiple: [16]   # N = 8192
        - AssertSummationElementMultiple: [8]  # K = 1024
        - Groups:
          -
            - GlobalSplitU: [1]
              GlobalSplitUAlgorithm: MultipleBuffer
              GlobalSplitUCoalesced: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1, 8192, 1, 1024]
        - ActivationArgs:
          - [Enum: none]
        - BiasTypeArgs: [s]

    - # Clustering: every workgroup reads the whole of A, so grouping them should let one GL2
      # serve the shared operand. ClusterAIDMapping -2 splits clusters over the two AIDs.
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 4]  # MT16x64, 128 wg
          - [16, 16, 32, 1, 1, 1, 2, 1, 4]  # MT16x128, 64 wg, shipped library's pick
          - [16, 16, 32, 1, 1, 1, 4, 1, 4]  # MT16x256, 32 wg
        - DepthU: [256]
        - ClusterDim: [[1, 1], [1, 2], [1, 4], [1, 8], [2, 1], [2, 2], [4, 4]]  # 1x16 unsupported
        - ClusterLocalRead: [0, 1]           # shipped library uses CLR1
        - ClusterAIDMapping: [-1, -2]
        - HalfPLR: [0]
        - PrefetchGL2: [0]
        - WorkGroupMappingXCC: [1]
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - TDMInst: [3]
        - TDMIterateMode: [0]
        - TDMSplit: [False]
        - TDMPlusLdsBuf: [-1]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - LDSSegmentInterleave: [0]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - StoreVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [False]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
        - AssertFree0ElementMultiple: [1]    # M = 1
        - AssertFree1ElementMultiple: [16]   # N = 8192
        - AssertSummationElementMultiple: [8]  # K = 1024
        - Groups:
          -
            - GlobalSplitU: [1, 2]
              GlobalSplitUAlgorithm: MultipleBuffer
              GlobalSplitUCoalesced: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1, 8192, 1, 1024]
        - ActivationArgs:
          - [Enum: none]
        - BiasTypeArgs: [s]

    - # Preamble and accumulator init. At ~11 us a kernel the fixed cost is a real share of the
      # runtime, and the shipped library leaves shadow init on (FDSI0) where we force it off.
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 4]  # MT16x64, 128 wg
          - [16, 16, 32, 1, 1, 1, 2, 1, 4]  # MT16x128, 64 wg, shipped library's pick
          - [16, 16, 32, 1, 1, 1, 4, 1, 4]  # MT16x256, 32 wg
        - DepthU: [128, 256]
        - ForceDisableShadowInit: [False, True]
        - InitCIterWmma: [-1, 0, 1]          # init C with an MFMA instead of v_mov
        - UseSgprForGRO: [-1, 0, 1]
        - LDSSegmentInterleave: [0, 1]       # docs recommend sweeping both when tuning
        - HalfPLR: [0]
        - PrefetchGL2: [0]
        - WorkGroupMappingXCC: [1]
        - TDMInst: [3]
        - TDMIterateMode: [0]
        - TDMSplit: [False]
        - TDMPlusLdsBuf: [-1]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - ClusterLocalRead: [0]
        - ClusterDim: [[1, 1]]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - StoreVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [False]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
        - AssertFree0ElementMultiple: [1]    # M = 1
        - AssertFree1ElementMultiple: [16]   # N = 8192
        - AssertSummationElementMultiple: [8]  # K = 1024
        - Groups:
          -
            - GlobalSplitU: [1]
              GlobalSplitUAlgorithm: MultipleBuffer
              GlobalSplitUCoalesced: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1, 8192, 1, 1024]
        - ActivationArgs:
          - [Enum: none]
        - BiasTypeArgs: [s]

    - # Cache hints. B is 16 MB streamed once and A is 2 KB wanted by everyone, so marking B
      # as the throwaway operand should stop it evicting A.
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 4]  # MT16x64, 128 wg
          - [16, 16, 32, 1, 1, 1, 2, 1, 4]  # MT16x128, 64 wg, shipped library's pick
          - [16, 16, 32, 1, 1, 1, 4, 1, 4]  # MT16x256, 32 wg
        - DepthU: [256]
        - NonTemporalB: [0, 1, 2, 3]
        - TemporalHintB: [0, 1, 2, 3]        # gfx1250-only hint modifier
        - HalfPLR: [0]
        - PrefetchGL2: [0]
        - WorkGroupMappingXCC: [1]
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - TDMInst: [3]
        - TDMIterateMode: [0]
        - TDMSplit: [False]
        - TDMPlusLdsBuf: [-1]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - ClusterLocalRead: [0]
        - ClusterDim: [[1, 1]]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - LDSSegmentInterleave: [0]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - StoreVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [False]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
        - AssertFree0ElementMultiple: [1]    # M = 1
        - AssertFree1ElementMultiple: [16]   # N = 8192
        - AssertSummationElementMultiple: [8]  # K = 1024
        - Groups:
          -
            - GlobalSplitU: [1, 2]
              GlobalSplitUAlgorithm: MultipleBuffer
              GlobalSplitUCoalesced: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1, 8192, 1, 1024]
        - ActivationArgs:
          - [Enum: none]
        - BiasTypeArgs: [s]

LibraryLogic:
  ScheduleName: "gfx1250"
  DeviceNames: ["Device 75c8"]   # MI450-MC Lyte, confirmed from /sys PCI device id 0x75c8
  ArchitectureName: "gfx1250"
  LibraryType: "Equality"
