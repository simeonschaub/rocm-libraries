TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch

GlobalParameters:
  Architecture: gfx1250
  KernelTime: True
  PreciseKernelTime: False
  SleepPercent: 0
  SyncsPerBenchmark: 1
  NumBenchmarks: 1
  NumWarmups: 200
  EnqueuesPerSync: 500
  SkipSlowSolutionRatio: 0.5
  RotatingBufferSize: 512
  NumElementsToValidate: 0
  NumElementsToValidateWinner: 0
  ExitOnFails: 0
  BoundsCheck: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitSeed: 1
  CSVExportWinner: True
  CSVMergeSameProblemID: True
  CpuThreads: 32
  PrintLevel: 1
  PrintSolutionRejectionReason: True
  KeepBuildTmp: False
  UseEffLike: False

BenchmarkProblems:
  -
    - # ProblemType, TN (Cijk_Alik_Bljk_BBS_BH_Bias_HA_S_SAV_UserArgs)
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      UseBias: 1
      Batched: True
      UseScaleAlphaVec: 1
      Activation: True
      ActivationType: hipblaslt_all
      ActivationComputeDataType: s
      SupportUserArgs: True

    - # M = 1
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        # MT0 is 16 throughout: M = 1 cannot use more. MT1 carries the parallelism.
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]  # MT16x16,  144 wg
          - [16, 16, 32, 1, 1, 1, 1, 1, 2]  # MT16x32,   72 wg
          - [16, 16, 32, 1, 1, 1, 3, 1, 1]  # MT16x48,   48 wg
          - [16, 16, 32, 1, 1, 1, 1, 1, 4]  # MT16x64,   36 wg
          - [16, 16, 32, 1, 1, 1, 3, 1, 2]  # MT16x96,   24 wg
          - [16, 16, 32, 1, 1, 1, 2, 1, 4]  # MT16x128,  18 wg
          - [16, 16, 32, 1, 1, 1, 3, 1, 4]  # MT16x192,  12 wg
          - [16, 16, 32, 1, 1, 1, 4, 1, 4]  # MT16x256,   9 wg
        - DepthU: [128, 256, 512]
        - HalfPLR: [0, 2]
        - PrefetchGL2: [1]
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - TDMInst: [3]
        - TDMIterateMode: [0]
        - TDMSplit: [False]
        - TDMPlusLdsBuf: [-1]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - ClusterLocalRead: [0]
        - ClusterDim: [[1, 1]]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - LDSSegmentInterleave: [0]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - StoreVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [False]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
        - AssertFree0ElementMultiple: [1]    # M = 1
        - AssertFree1ElementMultiple: [16]   # N = 2304
        - AssertSummationElementMultiple: [8]  # K = 8192
        - Groups:
          -
            - GlobalSplitU: [1, 2, 4, 8, 16, 32]
              GlobalSplitUAlgorithm: MultipleBuffer
            - GlobalSplitU: [1, 2, 4, 8, 16, 32]
              GlobalSplitUAlgorithm: MultipleBufferSingleKernel
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1, 2304, 1, 8192]
        - ActivationArgs:
          - [Enum: none]
        - BiasTypeArgs: [s]

LibraryLogic:
  ScheduleName: "gfx1250"
  DeviceNames: ["Device 75c8"]   # MI450-MC Lyte, confirmed from /sys PCI device id 0x75c8
  ArchitectureName: "gfx1250"
  LibraryType: "Equality"
